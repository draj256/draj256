<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; }
    .header { font: 600 16px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, sans-serif; fill: #40c463; }
    .label { font: 400 12px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, sans-serif; fill: #8b949e; }
    .val { font: 600 12px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, sans-serif; fill: #ffffff; }
    .bar-bg { fill: #21262d; rx: 3; }
    .bar-fill { fill: #40c463; }
    .divider { stroke: #30363d; stroke-width: 1; }
    .chart-label { font: 400 10.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, sans-serif; fill: #8b949e; }
    .badge { font: 600 11px 'Segoe UI', -apple-system, BlinkMacSystemFont, Ubuntu, sans-serif; fill: #40c463; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; stroke: #e1e4e8; }
      .header { fill: #238636; }
      .label { fill: #586069; }
      .val { fill: #24292e; }
      .bar-bg { fill: #eaecef; }
      .bar-fill { fill: #238636; }
      .divider { stroke: #e1e4e8; }
      .chart-label { fill: #586069; }
      .badge { fill: #238636; }
    }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="494" height="194" rx="4.5" stroke-width="1"/>
  <text x="25" y="34" class="header">⏰ Productive Hours &amp; Commit Habits</text>

  <!-- Left: Time of Day Bars -->
  <g transform="translate(25, 52)">
    <text x="0" y="11" class="label">🌅 Morning (06-12h)</text>
    <rect x="130" y="2" width="100" height="10" class="bar-bg"/>
    <rect x="130" y="2" width="29" height="10" rx="3" class="bar-fill"/>
    <text x="240" y="11" class="val">29%</text>
  </g>

  <g transform="translate(25, 78)">
    <text x="0" y="11" class="label">☀️ Daytime (12-18h)</text>
    <rect x="130" y="2" width="100" height="10" class="bar-bg"/>
    <rect x="130" y="2" width="30" height="10" rx="3" class="bar-fill"/>
    <text x="240" y="11" class="val">30%</text>
  </g>

  <g transform="translate(25, 104)">
    <text x="0" y="11" class="label">🌇 Evening (18-24h)</text>
    <rect x="130" y="2" width="100" height="10" class="bar-bg"/>
    <rect x="130" y="2" width="41" height="10" rx="3" class="bar-fill"/>
    <text x="240" y="11" class="val">41%</text>
  </g>

  <g transform="translate(25, 130)">
    <text x="0" y="11" class="label">🌙 Night (00-06h)</text>
    <rect x="130" y="2" width="100" height="10" class="bar-bg"/>
    <rect x="130" y="2" width="0" height="10" rx="3" class="bar-fill"/>
    <text x="240" y="11" class="val">0%</text>
  </g>

  <line class="divider" x1="268" y1="46" x2="268" y2="168"/>

  <!-- Right: Day of Week Bars -->
  <text x="285" y="58" class="chart-label">Day of Week Activity</text>
  
      <g>
        <rect x="285" y="121" width="14" height="4" rx="3" class="bar-fill"/>
        <text x="292" y="142" text-anchor="middle" class="chart-label">M</text>
      </g>
    
      <g>
        <rect x="311" y="121" width="14" height="4" rx="3" class="bar-fill"/>
        <text x="318" y="142" text-anchor="middle" class="chart-label">T</text>
      </g>
    
      <g>
        <rect x="337" y="93" width="14" height="32" rx="3" class="bar-fill"/>
        <text x="344" y="142" text-anchor="middle" class="chart-label">W</text>
      </g>
    
      <g>
        <rect x="363" y="105" width="14" height="20" rx="3" class="bar-fill"/>
        <text x="370" y="142" text-anchor="middle" class="chart-label">T</text>
      </g>
    
      <g>
        <rect x="389" y="70" width="14" height="55" rx="3" class="bar-fill"/>
        <text x="396" y="142" text-anchor="middle" class="chart-label">F</text>
      </g>
    
      <g>
        <rect x="415" y="121" width="14" height="4" rx="3" class="bar-fill"/>
        <text x="422" y="142" text-anchor="middle" class="chart-label">S</text>
      </g>
    
      <g>
        <rect x="441" y="121" width="14" height="4" rx="3" class="bar-fill"/>
        <text x="448" y="142" text-anchor="middle" class="chart-label">S</text>
      </g>
    

  <g transform="translate(285, 166)">
    <text x="0" y="0" class="badge">⚡ Peak: Friday (Evening)</text>
  </g>
</svg>